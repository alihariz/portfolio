<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Between these markers, scripts/prerender.mjs writes the title,
         description, canonical link, Open Graph and Twitter tags and the
         schema.org data, all from the document the page is rendered from.
         What is here is only a placeholder for `npm run dev`. -->
    <!--head:start-->
    <title>Ali Hariz Anuari</title>
    <!--head:end-->

    <!-- Matches the Organic ground so mobile browser chrome doesn't clash. -->
    <meta name="theme-color" content="#f5ead8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2e2b25" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Set the theme before first paint so a dark-mode visitor never sees a
         flash of the cream ground. The Content-Security-Policy allows this one
         inline script by its hash (deploy/Caddyfile.site); change a byte of it
         and test/headers.test.mjs says which hash to put there instead. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- The markers around #root ask Cloudflare's Email Address Obfuscation
         (on by default) to leave the page alone. It would rewrite the mailto:
         links in the prerendered HTML, and React would then find markup it did
         not render and redraw the whole page in the browser. -->
    <!--email_off--><div id="root"><!--app--></div><!--/email_off-->
    <!--site-data-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
