<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ali Hariz Anuari — Full-stack &amp; machine-learning engineer</title>
    <meta name="description" content="Final-year Software Engineering student at UTM. Six months building production systems inside Malaysia Airports' IT division: a legacy finance tool migrated to the browser, and an NLP classifier that automates 95% of complaint triage." />
    <meta name="author" content="Ali Hariz Bin Anuari" />
    <link rel="canonical" href="https://aliharizanuari.org/" />

    <!-- Matches the Organic ground so mobile browser chrome doesn't clash. -->
    <meta name="theme-color" content="#f5ead8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2e2b25" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aliharizanuari.org/" />
    <meta property="og:title" content="Ali Hariz Anuari — Full-stack &amp; machine-learning engineer" />
    <meta property="og:description" content="I take systems people already depend on and rebuild them so they run in a browser, explain themselves, and outlast me." />
    <meta property="og:locale" content="en_MY" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ali Hariz Anuari — Full-stack &amp; machine-learning engineer" />
    <meta name="twitter:description" content="Six months shipping inside Malaysia Airports IT. UTM Software Engineering, graduating October 2026." />

    <!-- Set the theme before first paint so a dark-mode visitor never sees a
         flash of the cream ground. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
